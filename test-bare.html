<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test Bare">
<meta name="theme-color" content="#17130F">
<link rel="manifest" href="test-manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Test Bare</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#17130F; }
  body {
    overflow:hidden;
    overscroll-behavior:none;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    color:#EDE9E1;
  }
  #root {
    height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }
  header {
    flex:none;
    padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
    text-align:center;
    font:11px/1 ui-monospace, monospace;
    letter-spacing:.14em;
    color:#948F82;
    border-bottom:1px solid rgba(237,233,225,.08);
  }
  main {
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px;
  }
  .card {
    background:rgba(237,233,225,.05);
    border:1px solid rgba(237,233,225,.08);
    border-radius:18px;
    padding:20px;
    margin-bottom:12px;
    min-height:120px;
  }
  .card b { display:block; font-size:16px; margin-bottom:8px; }
  .card span { color:#948F82; font-size:13px; }
  nav {
    flex:none;
    display:flex;
    align-items:flex-end;
    padding:6px 8px max(8px, calc(env(safe-area-inset-bottom) - 14px));
    border-top:1px solid rgba(237,233,225,.08);
    background:#17130F;
  }
  nav button {
    flex:1;
    border:0;
    background:transparent;
    color:#948F82;
    font-size:11px;
    padding:9px 2px 5px;
    min-height:54px;
  }
  nav button.active { color:#EDE9E1; font-weight:600; }
  #marker {
    position:fixed;
    bottom:0; left:0; right:0;
    height:6px;
    background:#ff00ff;
    z-index:99999;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="root">
  <header>TEST BARE — HOME</header>
  <main>
    <div class="card"><b>Card 1</b><span>Contenuto di prova</span></div>
    <div class="card"><b>Card 2</b><span>Contenuto di prova</span></div>
    <div class="card"><b>Card 3</b><span>Contenuto di prova</span></div>
    <div class="card"><b>Card 4</b><span>Contenuto di prova</span></div>
  </main>
  <nav>
    <button class="active">Home</button>
    <button>Mese</button>
    <button>Storico</button>
    <button>Aperti</button>
  </nav>
</div>
<div id="marker"></div>
</body>
</html>

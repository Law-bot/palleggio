<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Palleggio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211A2C;
    --ink-soft:#5A4E68;
    --paper:#FBF1E2;
    --paper-raised:#FFF9EE;
    --accent:#E15C3A;
    --accent-ink:#FFF9EE;
    --accent-2:#2F8F82;
    --gold:#D9962F;
    --line:rgba(33,26,44,0.13);
    --shadow:rgba(33,26,44,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F3E9D8;
      --ink-soft:#B9AB97;
      --paper:#18131F;
      --paper-raised:#231C2C;
      --accent:#F1795A;
      --accent-ink:#1B1622;
      --accent-2:#57BBAB;
      --gold:#EAB65C;
      --line:rgba(243,233,216,0.14);
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F3E9D8;
    --ink-soft:#B9AB97;
    --paper:#18131F;
    --paper-raised:#231C2C;
    --accent:#F1795A;
    --accent-ink:#1B1622;
    --accent-2:#57BBAB;
    --gold:#EAB65C;
    --line:rgba(243,233,216,0.14);
    --shadow:rgba(0,0,0,0.45);
  }

  html, body{
    height:100%;
    overflow:hidden;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Schibsted Grotesk', system-ui, sans-serif;
    margin:0;
    padding:0;
  }

  .page{
    width:100vw;
    height:100dvh;
  }

  .game-frame{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--paper-raised);
    outline:none;
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:pointer;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:32px;
    pointer-events:none;
  }
  .overlay .chip{
    font-family:'Schibsted Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent-ink);
    background:var(--accent);
    padding:10px 20px;
    border-radius:999px;
    box-shadow:0 10px 22px -10px rgba(0,0,0,0.45);
  }
  .overlay .big{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    color:var(--paper);
    text-shadow:0 2px 14px rgba(0,0,0,0.35);
  }
  .overlay .small{
    font-size:14px;
    color:var(--paper);
    opacity:0.85;
  }
  #overOverlay{
    background:linear-gradient(180deg, rgba(24,19,31,0.15), rgba(24,19,31,0.72));
    pointer-events:none;
  }
  #overOverlay.show{ pointer-events:auto; }
  button.retry{
    pointer-events:auto;
    font-family:'Schibsted Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--accent-ink);
    background:var(--accent);
    border:none;
    padding:13px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(0,0,0,0.5);
  }
  button.retry:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }
  button.retry:active{ transform:translateY(1px); }

  .hud{
    position:absolute;
    top:16px;
    left:16px;
    right:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
  }
  .hud .score{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:34px;
    color:var(--paper);
    text-shadow:0 2px 10px rgba(0,0,0,0.35);
    transform-origin:left center;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .hud .score.pop{ transform:scale(1.28); }
  .hud .best{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--paper);
    opacity:0.75;
    text-align:right;
  }
  .hud .best b{
    display:block;
    font-family:'Fraunces', serif;
    font-style:normal;
    font-weight:600;
    font-size:18px;
    font-variant-numeric:tabular-nums;
    text-transform:none;
    letter-spacing:0;
  }

  .hud .wind{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--paper);
    opacity:0;
    transition:opacity .45s ease;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,0.35));
  }
  .hud .wind.show{ opacity:0.9; }
  .hud .wind.intro{ animation:windPulse 1.5s ease-out; }
  .hud .wind-label{
    font-size:10px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    opacity:0.85;
  }
  .wind-line{
    transform-origin:left center;
    animation:windDrift 1.5s ease-in-out infinite;
  }
  .wind-line.l2{ animation-delay:.15s; }
  .wind-line.l3{ animation-delay:.3s; }
  @keyframes windDrift{
    0%,100%{ transform:translateX(0); opacity:.5; }
    50%{ transform:translateX(4px); opacity:1; }
  }
  @keyframes windPulse{
    0%{ transform:scale(0.5); opacity:0; }
    35%{ transform:scale(1.3); opacity:1; }
    65%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1); opacity:0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .wind-line{ animation:none; }
    .hud .wind.intro{ animation:none; }
    * { scroll-behavior:auto !important; }
  }
</style>

<div class="page">
  <div class="game-frame" id="frame" tabindex="0" role="application" aria-label="Palleggio — tocca o premi spazio per colpire la palla">
    <canvas id="game"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="score" id="scoreLabel">0</div>
      <div class="wind" id="windBadge" aria-hidden="true">
        <svg viewBox="0 0 32 24" width="26" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <path class="wind-line l1" d="M3 7 H23"/>
          <path class="wind-line l2" d="M3 13 H27"/>
          <path class="wind-line l3" d="M3 19 H19"/>
        </svg>
        <span class="wind-label">Vento</span>
      </div>
      <div class="best">Record<b id="bestLabel">0</b></div>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="chip">Tocca per iniziare</div>
      <div class="small">Un tocco al momento giusto tiene alta la palla</div>
    </div>

    <div class="overlay" id="overOverlay" hidden>
      <div class="big" id="finalScore">0 tocchi</div>
      <div class="small" id="finalBest">Record: 0</div>
      <button class="retry" id="retryBtn">Rigioca</button>
    </div>
  </div>
</div>

<script>
(function(){
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const hud = document.getElementById('hud');
  const scoreLabel = document.getElementById('scoreLabel');
  const bestLabel = document.getElementById('bestLabel');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const retryBtn = document.getElementById('retryBtn');
  const windBadge = document.getElementById('windBadge');
  const stageEls = Array.from(document.querySelectorAll('.stage'));

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const BEST_KEY = 'palleggio-best-score';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestLabel.textContent = best;

  const STAGES = [
    { name:'cortile', threshold:0 },
    { name:'vicolo', threshold:10 },
    { name:'piazza', threshold:25 },
    { name:'spiaggia', threshold:50 }
  ];
  function stageIndexForScore(s){
    let idx = 0;
    for(let i=0;i<STAGES.length;i++){ if(s >= STAGES[i].threshold) idx = i; }
    return idx;
  }
  function updateStagesUI(score){
    const cur = stageIndexForScore(score);
    stageEls.forEach((el,i)=>{
      el.classList.toggle('active', i===cur);
      el.classList.toggle('done', i<cur);
    });
  }

  let state = 'start'; // start | playing | over
  let t = 0;
  let score = 0;
  let particles = [];
  let trail = [];
  let shake = 0; // camera shake magnitude, decays
  let missSlump = 0; // 0..1 character slump on game over
  let windIntroduced = false; // one-time "wind is arriving" telegraph, per run
  let windIntroT = 0; // countdown driving that telegraph's visibility

  const player = { x:0, y:0, kick:0, lean:0 };
  const ball = { x:0, y:0, vx:0, vy:0, r:16, rot:0, squashX:1, squashY:1 };

  function resetRun(){
    score = 0;
    scoreLabel.textContent = '0';
    updateStagesUI(0);
    player.x = W*0.5;
    player.y = H*0.80;
    player.lean = 0;
    ball.x = W*0.5;
    ball.y = player.y - 30;
    ball.vx = 0; ball.vy = 0; ball.rot = 0;
    ball.squashX = 1; ball.squashY = 1;
    particles = [];
    trail = [];
    shake = 0;
    missSlump = 0;
    windIntroduced = false;
    windIntroT = 0;
    windBadge.classList.remove('show','intro');
  }

  function burst(x,y,color){
    if(reduceMotion) return;
    for(let i=0;i<9;i++){
      const a = -Math.PI/2 + (Math.random()-0.5)*2.6;
      const sp = 100 + Math.random()*140;
      particles.push({
        x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:1, spin:(Math.random()-0.5)*8, size:2+Math.random()*2.5, color
      });
    }
  }

  // small pale streaks flying in the direction a gust just pushed the ball —
  // lets the player read which way the wind shoved them, after the fact
  function windGust(x,y,dir){
    if(reduceMotion) return;
    for(let i=0;i<5;i++){
      particles.push({
        x, y: y + (Math.random()-0.5)*18,
        vx: dir*(160+Math.random()*90), vy:(Math.random()-0.5)*50,
        life:1, spin:0, size:3+Math.random()*2, color:'rgba(255,255,255,0.7)'
      });
    }
  }

  // ---------- Difficulty curve ----------
  // Timing window (px reach, vy tolerance) shrinks gently with score, floor keeps it fair.
  function reachFor(s){ return Math.max(46, 78 - s*0.7); }
  function vyToleranceFor(s){ return Math.max(-140, -40 - s*1.6); }
  function gravityFor(s){
    // smoother, unbounded ramp with diminishing returns so late game keeps tightening
    return 30 + 26*(1 - Math.exp(-s/22)) + s*0.12;
  }
  function windFor(s){
    // small unpredictable lateral push introduced after the first stage, grows slowly
    if(s < 8) return 0;
    return Math.min(70, (s-8)*2.1);
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function tryHit(px){
    const reach = reachFor(score);
    const vyTol = vyToleranceFor(score);
    // the ball is only kickable while it's actually near the character's body —
    // tied to player.y (not a fixed slice of the screen), so it can't be hit
    // while still sailing high overhead: that read as fake, per user feedback.
    const nearBody = ball.y > player.y - 55 && ball.y < player.y + 30;
    const inReach = Math.abs(ball.x - player.x) < reach && nearBody && ball.vy >= vyTol;
    player.kick = 1;
    if(!inReach) return false;
    const stageIdx = stageIndexForScore(score);
    const power = 560 + Math.min(score,30)*2.4;
    ball.vy = -power;
    // instinctive correction: the further the ball has drifted from the body,
    // the harder the touch pulls it back — a real juggler never lets it wander.
    const offset = ball.x - player.x;
    const restore = -offset * 1.1;
    const steer = clamp(((px!=null ? px : ball.x) - player.x) * 0.12, -50, 50);
    const windMag = windFor(score);
    const wind = windMag * (Math.random()*2-1);
    ball.vx = clamp(ball.vx*0.15 + restore + steer + wind, -170, 170);
    ball.squashX = 1.28; ball.squashY = 0.72;
    score += 1;
    scoreLabel.textContent = String(score);
    scoreLabel.classList.remove('pop'); void scoreLabel.offsetWidth; scoreLabel.classList.add('pop');
    if(score > best){ best = score; localStorage.setItem(BEST_KEY, String(best)); bestLabel.textContent = best; }
    updateStagesUI(score);
    burst(ball.x, ball.y, STAGE_ACCENT[stageIdx]);
    if(windMag > 0) windGust(ball.x, ball.y, wind >= 0 ? 1 : -1);
    if(!windIntroduced && score === 8){ windIntroduced = true; windIntroT = 1.6; windBadge.classList.add('intro'); }
    shake = Math.min(shake + 5, 10);
    return true;
  }

  function onPointerDown(e){
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    handleTap(px);
  }
  function handleTap(px){
    if(state === 'start'){
      state = 'playing';
      hud.hidden = false;
      startOverlay.hidden = true;
      tryHit(px);
    } else if(state === 'playing'){
      tryHit(px);
    }
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  frame.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      handleTap(ball.x);
    }
  });
  retryBtn.addEventListener('click', function(){
    overOverlay.hidden = true;
    overOverlay.classList.remove('show');
    state = 'start';
    hud.hidden = true;
    startOverlay.hidden = false;
    resetRun();
  });

  function gameOver(){
    state = 'over';
    finalScore.textContent = score === 1 ? '1 tocco' : score + ' tocchi';
    finalBest.textContent = 'Record: ' + best;
    overOverlay.hidden = false;
    requestAnimationFrame(()=>overOverlay.classList.add('show'));
  }

  // ---------- Scene palettes ----------
  const STAGE_ACCENT = ['#E15C3A', '#E3792F', '#D9962F', '#E9C36A'];

  function lerp(a,b,t){ return a+(b-a)*t; }

  // Atmospheric Minimalist palette helpers — soft radial glows and gradient
  // grounds/skies are how this direction reads as "a moment of light" rather
  // than a flat vector template (Alto's Odyssey is the reference).
  function hexA(hex, a){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function glow(cx, cy, r, hexColor, alpha){
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0, hexA(hexColor, alpha));
    g.addColorStop(1, hexA(hexColor, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }

  function skyGradient(stageIdx){
    const stops = {
      cortile:  [[0,'#7FA8C9'],[0.45,'#E9C79A'],[1,'#F6E7C4']],
      vicolo:   [[0,'#7D4C6B'],[0.5,'#E8703F'],[1,'#F8C48A']],
      piazza:   [[0,'#1B1640'],[0.55,'#4A2F55'],[1,'#8C5B6E']],
      spiaggia: [[0,'#060814'],[0.6,'#0F1830'],[1,'#1C2C4A']]
    };
    const names = ['cortile','vicolo','piazza','spiaggia'];
    return stops[names[stageIdx]];
  }

  function drawSky(stageIdx){
    const stops = skyGradient(stageIdx);
    const g = ctx.createLinearGradient(0,0,0,H*0.80);
    stops.forEach(([offset,color])=> g.addColorStop(offset,color));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawGround(colorTop, colorBottom){
    const g = ctx.createLinearGradient(0,H*0.80,0,H);
    g.addColorStop(0, colorTop);
    g.addColorStop(1, colorBottom || colorTop);
    ctx.fillStyle = g;
    ctx.fillRect(0, H*0.80, W, H*0.20);
  }

  function drawSun(x,y,r,color,glowR){
    glow(x,y, glowR || r*2.6, color, 0.55);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  function drawCortile(){
    drawSky(0);
    const wallG = ctx.createLinearGradient(0,H*0.42,0,H*0.82);
    wallG.addColorStop(0,'#EAC49B'); wallG.addColorStop(1,'#D9A87A');
    ctx.fillStyle = wallG;
    ctx.fillRect(0, H*0.42, W, H*0.40);
    drawSun(W*0.82, H*0.16, 26, '#FBE3A0');
    ctx.fillStyle = 'rgba(90,60,50,0.24)';
    for(let i=0;i<2;i++){
      ctx.fillRect(W*0.14 + i*W*0.30, H*0.48, W*0.14, H*0.14);
    }
    const sway = reduceMotion ? 0 : Math.sin(t*1.2)*6;
    ctx.strokeStyle = 'rgba(70,50,45,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W*0.08,H*0.40); ctx.lineTo(W*0.92,H*0.40); ctx.stroke();
    const clothes = ['#E15C3A','#F3E6C7','#2F8F82'];
    clothes.forEach((c,i)=>{
      const cx = W*(0.22 + i*0.28) + sway;
      ctx.fillStyle = c;
      ctx.globalAlpha = 0.88;
      ctx.fillRect(cx-10, H*0.40, 20, 22);
      ctx.globalAlpha = 1;
    });
    drawGround('#DDB077', '#C08F55');
    ctx.fillStyle = '#B5613C';
    ctx.fillRect(W*0.08, H*0.76, 26, 20);
    ctx.fillStyle = '#3FA35B';
    ctx.beginPath(); ctx.ellipse(W*0.08+13, H*0.74, 16, 14, 0, 0, Math.PI*2); ctx.fill();
  }

  function drawVicolo(){
    drawSky(1);
    const heights = [0.5,0.38,0.46,0.34,0.5];
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = '#3A2A3E';
    let bw = W/heights.length;
    heights.forEach((h,i)=>{
      ctx.fillRect(i*bw, H*(0.80-h), bw-3, H*h);
      if(i%2===0){
        const wx = i*bw+bw*0.3+4, wy = H*(0.80-h)+18;
        glow(wx, wy, 14, '#F6C86B', 0.55);
        ctx.fillStyle = '#F6C86B';
        ctx.fillRect(i*bw+bw*0.3, H*(0.80-h)+14, 8,8);
        ctx.fillStyle = '#3A2A3E';
      }
    });
    ctx.globalAlpha = 1;
    if(!reduceMotion){
      ctx.strokeStyle = 'rgba(40,25,35,0.6)';
      ctx.lineWidth = 2;
      for(let i=0;i<3;i++){
        const sx = ((t*40 + i*140) % (W+60)) - 30;
        const sy = H*0.18 + i*18 + Math.sin(t*2+i)*6;
        ctx.beginPath();
        ctx.moveTo(sx-8,sy); ctx.quadraticCurveTo(sx,sy-6,sx+8,sy);
        ctx.stroke();
      }
    }
    drawGround('#9C8C8A', '#6E615F');
  }

  function drawPiazza(){
    drawSky(2);
    ctx.strokeStyle = 'rgba(240,220,180,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0,H*0.14);
    ctx.quadraticCurveTo(W*0.5, H*0.24, W, H*0.14);
    ctx.stroke();
    const pulse = reduceMotion ? 1 : (0.6 + Math.sin(t*3)*0.4);
    for(let i=1;i<8;i++){
      const p = i/8;
      const lx = lerp(0,W,p);
      const ly = (1-p)*(1-p)*H*0.14 + 2*(1-p)*p*H*0.24 + p*p*H*0.14;
      glow(lx, ly+6, 11, '#F5C96B', 0.35+0.3*pulse);
      ctx.fillStyle = `rgba(245,201,107,${0.5+0.5*pulse})`;
      ctx.beginPath(); ctx.arc(lx,ly+6,3,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#241A38';
    ctx.beginPath(); ctx.ellipse(W*0.5, H*0.66, 70, 14, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(W*0.5-6, H*0.52, 12, 16);
    drawGround('#6B5278', '#43324E');
  }

  function drawSpiaggia(){
    drawSky(3);
    if(!starField.length){
      for(let i=0;i<40;i++){
        starField.push({x:Math.random(),y:Math.random()*0.55,seed:Math.random()*10});
      }
    }
    starField.forEach(s=>{
      const tw = reduceMotion ? 0.8 : 0.5+0.5*Math.sin(t*2+s.seed*6);
      ctx.fillStyle = `rgba(255,250,235,${0.3+0.6*tw})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, 1.4, 0, Math.PI*2); ctx.fill();
    });
    glow(W*0.78, H*0.16, 60, '#EFE6C8', 0.4);
    ctx.fillStyle = '#EFE6C8';
    ctx.beginPath(); ctx.arc(W*0.78, H*0.16, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(150,140,110,0.35)';
    ctx.beginPath(); ctx.arc(W*0.74, H*0.13, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W*0.82, H*0.20, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#182B4A';
    ctx.fillRect(0, H*0.74, W, H*0.06);
    drawGround('#D9C69A', '#B49A68');
  }

  const starField = [];
  const SCENE_DRAW = [drawCortile, drawVicolo, drawPiazza, drawSpiaggia];

  // ---------- Player (omino) ----------
  // Flat ink silhouette with a soft stage-tinted rim glow (Alto's Odyssey-style
  // backlight) — stays readable against all four scene palettes without needing
  // a skin tone that could match a background color.
  function drawPlayer(stageIdx){
    const bob = reduceMotion ? 0 : Math.sin(t*3)*2;
    const kick = player.kick;
    player.kick = Math.max(0, player.kick - 0.06);
    const slump = missSlump; // 0..1
    const targetLean = clamp((ball.x - player.x) * 0.05, -10, 10);
    player.lean += (targetLean - player.lean) * 0.12;

    const kx = player.x, ky = player.y + bob + slump*10;
    const ink = '#1D1624';
    const accent = STAGE_ACCENT[stageIdx];

    ctx.save();
    ctx.translate(kx, ky);
    ctx.rotate((player.lean*Math.PI/180) + slump*0.35);

    // long, soft raking shadow — offset toward lower-left as if lit from
    // upper-right, fading at both ends instead of a flat contact blob
    const shGrad = ctx.createLinearGradient(-44,0,36,0);
    shGrad.addColorStop(0, 'rgba(25,17,15,0)');
    shGrad.addColorStop(0.55, `rgba(25,17,15,${0.30 - slump*0.12})`);
    shGrad.addColorStop(1, 'rgba(25,17,15,0)');
    ctx.fillStyle = shGrad;
    ctx.beginPath();
    ctx.ellipse(-16, 28, 46 - slump*10, 8 - slump*2, 0, 0, Math.PI*2);
    ctx.fill();

    // soft atmospheric backlight halo behind the whole figure
    glow(0, -20, 62, accent, 0.26);

    ctx.shadowColor = accent;
    ctx.shadowBlur = 10;

    // back (static) leg
    ctx.fillStyle = ink;
    ctx.save();
    ctx.translate(-6, -4);
    ctx.fillRect(-4, 0, 8, 20);
    ctx.restore();

    // kicking leg (thigh + shin, eased swing)
    const swing = Math.sin(kick*Math.PI); // 0->1->0 easing across the kick
    ctx.save();
    ctx.translate(6, -4);
    ctx.rotate(-swing*1.05);
    ctx.fillStyle = ink;
    ctx.fillRect(-3, 0, 7, 11);
    ctx.save();
    ctx.translate(0, 11);
    ctx.rotate(swing*0.9);
    ctx.fillStyle = ink;
    ctx.fillRect(-3, 0, 7, 12);
    // boot accent
    ctx.shadowBlur = 0;
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.ellipse(3, 13, 6, 4, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 10; ctx.shadowColor = accent;
    ctx.restore();
    ctx.restore();

    // torso
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.moveTo(-14,-6);
    ctx.quadraticCurveTo(-16,-30, 0,-32);
    ctx.quadraticCurveTo(16,-30, 14,-6);
    ctx.quadraticCurveTo(0,0, -14,-6);
    ctx.fill();

    // arms (out for balance)
    ctx.strokeStyle = ink;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-13,-22); ctx.quadraticCurveTo(-24,-16+swing*4, -22,-6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(13,-22); ctx.quadraticCurveTo(24,-16-swing*4, 22,-8);
    ctx.stroke();

    // head
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(0,-42,11,0,Math.PI*2); ctx.fill();

    ctx.shadowBlur = 0;

    // sash — small saturated detail for personality, not a background-sized fill
    ctx.strokeStyle = '#2F8F82';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-11,-27); ctx.lineTo(9,-9);
    ctx.stroke();

    ctx.restore();
  }

  // ---------- Ball ----------
  function drawBallShadow(stageIdx){
    const groundY = H*0.83;
    const height = clamp((groundY - ball.y) / (groundY - H*0.15), 0, 1);
    const s = lerp(1, 0.42, height);
    const alpha = lerp(0.32, 0.08, height);
    ctx.fillStyle = `rgba(15,10,10,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(ball.x, groundY+2, ball.r*1.1*s, ball.r*0.4*s, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawBall(stageIdx){
    // motion trail
    trail.forEach((p,i)=>{
      const a = (i/trail.length) * 0.22;
      ctx.globalAlpha = a;
      ctx.fillStyle = STAGE_ACCENT[stageIdx];
      ctx.beginPath(); ctx.arc(p.x,p.y,ball.r*0.7,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // soft halo instead of a crisp rim — same atmospheric backlight the
    // character gets, so the ball reads as lit rather than outlined
    glow(ball.x, ball.y, ball.r*2.3, STAGE_ACCENT[stageIdx], 0.4);

    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rot);
    ctx.scale(ball.squashX, ball.squashY);
    const grad = ctx.createRadialGradient(-5,-6,2,0,0,ball.r);
    grad.addColorStop(0, '#FFFBF2');
    grad.addColorStop(1, '#EDE4D0');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,ball.r,0,Math.PI*2); ctx.fill();

    // a few scattered pentagon panels — an asymmetric, believable "football" read
    // rather than a perfectly radial ring (which reads as a flower at small sizes)
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,ball.r,0,Math.PI*2); ctx.clip();
    ctx.fillStyle = 'rgba(33,26,44,0.72)';
    drawPentagon(-0.06*ball.r, -0.34*ball.r, ball.r*0.36, 0);
    drawPentagon(0.42*ball.r, 0.10*ball.r, ball.r*0.30, 0.5);
    drawPentagon(-0.38*ball.r, 0.30*ball.r, ball.r*0.26, -0.4);
    drawPentagon(0.05*ball.r, 0.52*ball.r, ball.r*0.20, 0.9);
    ctx.restore();

    // faint rim, just enough edge definition to hold against a light sky
    ctx.strokeStyle = STAGE_ACCENT[stageIdx];
    ctx.globalAlpha = 0.32;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0,0,ball.r-0.7,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(30,20,20,0.14)';
    ctx.beginPath(); ctx.arc(0,0,ball.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawPentagon(cx, cy, size, rot){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = rot + (Math.PI*2*i)/5 - Math.PI/2;
      const x = cx + Math.cos(a)*size*0.5;
      const y = cy + Math.sin(a)*size*0.5;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.save();
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.translate(p.x,p.y);
      ctx.rotate(p.spin*p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min((now-last)/1000, 1/30);
    last = now;
    if(!reduceMotion || state==='playing') t += dt;

    const stageIdx = stageIndexForScore(score);

    ctx.save();
    if(shake > 0.02 && !reduceMotion){
      const sx = (Math.random()-0.5)*shake;
      const sy = (Math.random()-0.5)*shake;
      ctx.translate(sx, sy);
      shake *= 0.82;
    } else { shake = 0; }

    ctx.clearRect(-20,-20,W+40,H+40);
    SCENE_DRAW[stageIdx]();

    if(state === 'playing'){
      const g = gravityFor(score) * 60;
      ball.vy += g*dt;
      ball.x += ball.vx*dt;
      ball.y += ball.vy*dt;
      ball.rot += (ball.vx*dt)*0.02 + 0.05;

      trail.push({x:ball.x, y:ball.y});
      if(trail.length > 6) trail.shift();

      // the ball must always stay within the player's stance — otherwise it
      // reads as disconnected from the character instead of being juggled
      const envelope = reachFor(score) + ball.r*1.3;
      if(ball.x < player.x - envelope){ ball.x = player.x - envelope; ball.vx = Math.abs(ball.vx)*0.5; }
      if(ball.x > player.x + envelope){ ball.x = player.x + envelope; ball.vx = -Math.abs(ball.vx)*0.5; }

      if(ball.x - ball.r < 6){ ball.x = 6+ball.r; ball.vx *= -0.55; }
      if(ball.x + ball.r > W-6){ ball.x = W-6-ball.r; ball.vx *= -0.55; }

      const groundY = H*0.83;
      if(ball.y + ball.r >= groundY){
        ball.y = groundY - ball.r;
        gameOver();
      }
    } else if(state === 'start'){
      ball.y = player.y - 30 + Math.sin(t*2)*3;
      ball.x = player.x;
      trail.length = 0;
    } else if(state === 'over'){
      missSlump = Math.min(1, missSlump + dt*2.2);
    }

    // ease squash back to normal
    ball.squashX += (1-ball.squashX)*Math.min(1, dt*10);
    ball.squashY += (1-ball.squashY)*Math.min(1, dt*10);

    // wind indicator: telegraphed once just before it starts, then stays lit
    // for as long as it's actually pushing the ball around
    if(windIntroT > 0){
      windIntroT = Math.max(0, windIntroT - dt);
      windBadge.classList.add('show');
      if(windIntroT === 0) windBadge.classList.remove('intro');
    } else if(windFor(score) > 0){
      windBadge.classList.add('show');
    } else {
      windBadge.classList.remove('show');
    }

    particles.forEach(p=>{
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 320*dt; p.life -= dt*1.7;
    });
    particles = particles.filter(p=>p.life>0);

    drawBallShadow(stageIdx);
    drawPlayer(stageIdx);
    drawBall(stageIdx);
    drawParticles();

    ctx.restore();

    requestAnimationFrame(loop);
  }

  function init(){
    resize();
    resetRun();
    requestAnimationFrame(loop);
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(init);
  } else { init(); }
})();
</script>

</body></html>

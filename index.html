document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fdiv>\n\n        <div style=\"font-size:12.5px;color:var(--dim2);margin:24px 2px 12px\">COLORE D'ACCENTO<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n          <sc-for list=\"{{ accentSwatches }}\" as=\"a\" hint-placeholder-count=\"9\">\n            <button sc-camel-on-click=\"{{ a.pick }}\" style=\"width:44px;height:44px;border-radius:99px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#12140F;background:{{ a.color }};border:{{ a.border }}\">{{ a.check }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12.5px;color:var(--dim2);margin:24px 2px 12px\">COLORE DI SFONDO<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n          <sc-for list=\"{{ bgSwatches }}\" as=\"b\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ b.pick }}\" style=\"width:44px;height:44px;border-radius:99px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:{{ b.checkFg }};background:{{ b.color }};border:{{ b.border }}\">{{ b.check }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.5;color:var(--dim2);margin-top:10px\">Vale per l'header, la barra in basso e ogni schermata: sempre lo stesso colore.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-size:12.5px;color:var(--dim2);margin:24px 2px 12px\">ICONE DELLE CATEGORIE<\u002Fdiv>\n      <div class=\"grouped-card\">\n        <sc-for list=\"{{ catRows }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div class=\"grouped-card-subrow\" style=\"display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;gap:12px;min-height:52px;padding:0 15px\">\n              <button sc-camel-on-click=\"{{ c.toggleIcon }}\" style=\"border:0;background:var(--soft2);border-radius:11px;cursor:pointer;padding:0;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;flex:none\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"{{ c.color }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                  <sc-for list=\"{{ c.iconPaths }}\" as=\"p\" hint-placeholder-count=\"2\">\n                    <path d=\"{{ p.d }}\"><\u002Fpath>\n                  <\u002Fsc-for>\n                <\u002Fsvg>\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ c.toggleIcon }}\" style=\"flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;font-size:15px;color:var(--txt)\">{{ c.name }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ c.iconOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 15px 14px 63px\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ c.iconChoices }}\" as=\"ic\" hint-placeholder-count=\"12\">\n                    <button sc-camel-on-click=\"{{ ic.pick }}\" style=\"width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:{{ ic.bg }};border:{{ ic.border }}\">\n                      <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"{{ c.color }}\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <sc-for list=\"{{ ic.paths }}\" as=\"p\" hint-placeholder-count=\"2\">\n                          <path d=\"{{ p.d }}\"><\u002Fpath>\n                        <\u002Fsc-for>\n                      <\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSetBudget }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:20px 24px 18px\">\n      <div class=\"hero-title\">Budget del mese<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 24px calc(env(safe-area-inset-bottom) + 16px)\">\n      <div style=\"font-size:13px;line-height:1.5;color:var(--dim);margin-bottom:16px\">Un tetto per le uscite totali, con il residuo giornaliero in home.<\u002Fdiv>\n      <div class=\"grouped-card\">\n        <button sc-camel-on-click=\"{{ setMonthBudget }}\" class=\"grouped-row\" style=\"border-bottom:0\">\n          <span style=\"flex:1\">{{ mbSettingLabel }}<\u002Fspan><span style=\"color:var(--dim)\">modifica<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;line-height:1.5;color:var(--dim2);margin-top:14px\">Alternativo a Regola di risparmio e Obiettivo di risparmio: solo uno dei tre è attivo alla volta in home, nell'ordine Regola → Budget → Obiettivo.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSetRule }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:20px 24px 18px\">\n      <div class=\"hero-title\">Regola di risparmio<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 24px calc(env(safe-area-inset-bottom) + 16px)\">\n      <div style=\"font-size:13px;line-height:1.5;color:var(--dim);margin-bottom:16px\">Dividi la spesa disponibile in tre blocchi: Necessità, Desideri e Risparmio (quello che resta). Ogni spesa va assegnata a Necessità o Desideri quando la registri, dalla schermata Aggiungi spesa. Il Risparmio non si assegna: è semplicemente quello che avanza. Se una categoria è tutta trasferimenti verso altri conti (es. bonifici), usa \"Escludi da regola di risparmio\" nella schermata Categorie: verrà comunque contata come spesa nel totale del mese, ma tolta subito dalle entrate prima di dividerle 50-30-20.<\u002Fdiv>\n      <div class=\"grouped-card\">\n        <div class=\"grouped-row\" style=\"cursor:default;border-bottom:0\">\n          <span style=\"flex:1;color:var(--txt)\">Attiva<\u002Fspan>\n          <button sc-camel-on-click=\"{{ budgetRuleTgl.toggle }}\" role=\"switch\" aria-checked=\"{{ budgetRuleTgl.on }}\" aria-label=\"Regola di risparmio\" style=\"flex:none;width:50px;height:30px;border-radius:99px;border:0;padding:3px;cursor:pointer;display:flex;align-items:center;background:{{ budgetRuleTgl.track }};transition:background .22s ease\">\n            <span style=\"width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transform:{{ budgetRuleTgl.knob }};transition:transform .22s cubic-bezier(.2,.85,.25,1)\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ budgetRuleOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"grouped-card\" style=\"margin-top:16px\">\n          <sc-for list=\"{{ brPctRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div class=\"grouped-row\" style=\"cursor:default\">\n              <button sc-camel-on-click=\"{{ r.rename }}\" style=\"flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;font-size:14.5px;color:var(--txt)\">{{ r.label }}<\u002Fbutton>\n              <sc-if value=\"{{ r.editable }}\" hint-placeholder-val=\"{{ true }}\">\n                <input value=\"{{ r.pctValue }}\" sc-camel-on-change=\"{{ r.setPct }}\" sc-camel-input-mode=\"numeric\" style=\"width:44px;text-align:right;background:var(--soft2);border:0;border-radius:9px;padding:6px;color:var(--txt);font-size:14.5px;outline:none\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.readOnly }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"width:44px;text-align:right;color:var(--dim);font-size:14.5px\">{{ r.pctValue }}<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"color:var(--dim);font-size:14.5px;flex:none\">%<\u002Fspan>\n 02Fdiv>\n      <div class=\"grouped-card\">\n        <div class=\"grouped-row\" style=\"cursor:default;border-bottom:0\">\n          <span style=\"flex:1;color:var(--txt)\">Codice di 4 cifre<\u002Fspan>\n          <button sc-camel-on-click=\"{{ pinTgl.toggle }}\" role=\"switch\" aria-checked=\"{{ pinTgl.on }}\" aria-label=\"Codice di 4 cifre\" style=\"flex:none;width:50px;height:30px;border-radius:99px;border:0;padding:3px;cursor:pointer;display:flex;align-items:center;background:{{ pinTgl.track }};transition:background .22s ease\">\n            <span style=\"width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transform:{{ pinTgl.knob }};transition:transform .22s cubic-bezier(.2,.85,.25,1)\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ bioShow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"grouped-card\" style=\"margin-top:16px\">\n          <div class=\"grouped-row\" style=\"cursor:default;border-bottom:0\">\n            <span style=\"flex:1;color:var(--txt)\">Sblocco con il viso<\u002Fspan>\n            <button sc-camel-on-click=\"{{ bioTgl.toggle }}\" role=\"switch\" aria-checked=\"{{ bioTgl.on }}\" aria-label=\"Sblocco con il viso\" style=\"flex:none;width:50px;height:30px;border-radius:99px;border:0;padding:3px;cursor:pointer;display:flex;align-items:center;background:{{ bioTgl.track }};transition:background .22s ease\">\n              <span style=\"width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transform:{{ bioTgl.knob }};transition:transform .22s cubic-bezier(.2,.85,.25,1)\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSetRec }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:20px 24px 18px\">\n      <div class=\"hero-title\">Voci ricorrenti<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 24px calc(env(safe-area-inset-bottom) + 16px)\">\n      <div style=\"font-size:13px;line-height:1.5;color:var(--dim);margin-bottom:16px\">Spese o entrate che tornano ogni mese. Se l'importo cambia ogni volta, l'app te lo chiede invece di inventarlo.<\u002Fdiv>\n      <div data-stagger=\"1\" style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:18px\">\n        <sc-for list=\"{{ recRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div class=\"pill-row\" style=\"padding-right:8px\">\n            <span style=\"flex:none;width:10px;height:10px;border-radius:99px;background:{{ r.color }}\"><\u002Fspan>\n            <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\">\n              <span style=\"font-size:14.5px;font-weight:500\">{{ r.name }}<\u002Fspan>\n              <span style=\"font-size:11.5px;color:var(--dim2)\">{{ r.meta }}<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"app-mono\" style=\"font-size:15px;font-weight:600;white-space:nowrap\">{{ r.amountStr }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ r.remove }}\" style=\"border:0;background:transparent;cursor:pointer;color:var(--dim2);font-size:18px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;padding:0;flex:none\">⋯<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ noRec }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:6px 0 4px;font-size:13px;color:var(--dim2)\">Nessuna ricorrente.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openRecNew }}\" style=\"width:100%;height:48px;border:0;border-radius:13px;cursor:pointer;font-size:15px;font-weight:600;color:#12140F;background:{{ accent }}\">+ Aggiungi ricorrente<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSetData }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"pad l: 'Voci ricorrenti', summary: s.recurring.length ? s.recurring.length + (s.recurring.length === 1 ? ' voce' : ' voci') : 'Nessuna', k: 'rec' },\n        { label: 'Dati', summary: 'Backup, CSV', k: 'data' },\n      ].map(r => ({ label: r.label, summary: r.summary, go: r.custom || (() => { this.buzz(6); this.setState({ setPage: r.k }); this.go('setdetail'); }) })),\n\n      recDayOpen: !!s.recDayOpen,\n      recDayRot: s.recDayOpen ? 'rotate(90deg)' : 'rotate(0deg)',\n      toggleRecDay: () => { this.buzz(6); this.setState(st => ({ recDayOpen: !st.recDayOpen })); },\n      recDaySummary: s.recDay ? ('il ' + s.recDay) : 'scegli il giorno',\n      recDaySummaryColor: s.recDay ? 'var(--txt)' : 'var(--dim2)',\n      recDayChoices: Array.from({ length: 31 }, (_, i) => {\n        const day = String(i + 1);\n        return {\n          day,\n          bg: s.recDay === day ? 'var(--soft2)' : 'var(--soft)',\n          fg: s.recDay === day ? 'var(--txt)' : dim,\n          border: s.recDay === day ? '1px solid var(--bd)' : '1px solid var(--line)',\n          pick: () => { this.buzz(6); this.setState({ recDay: day, recDayOpen: false }); },\n        };\n      }),\n\n      darkTgl: swi(s.theme !== 'light', () => this.commit({ theme: s.theme === 'light' ? 'dark' : 'light' })),\n      recVarTgl: swi(!!s.recVariable, () => this.setState(st => ({ recVariable: !st.recVariable }))),\n      pinTgl: swi(!!s.pin, doTogglePin),\n      bioTgl: swi(!!s.bioId, doToggleBio),\n\n      hasBio: !!(s.pin && s.bioId),\n      bioLabel: s.bioBusy ? 'Attendi…' : 'Sblocca con il viso',\n      bioUnlock: async () => {\n        if (s.bioBusy) return;\n        this.setState({ bioBusy: true });\n        try {\n          if (await this.bioVerify()) { this.buzz(16); this.setState({ locked: false, pinEntry: '', bioBusy: false }); return; }\n        } catch (e) {}\n        this.setState({ bioBusy: false });\n      },\n      bioShow: !!(s.pin && s.bioOk),\n      bioState: s.bioId ? 'attivo' : 'disattivo',\n      bioStateColor: s.bioId ? accent : 'var(--dim)',\n      toggleBio: doToggleBio,\n\n      lockDesc: s.pin ? 'L\\u2019app chiede il codice a ogni apertura.'\n        : 'Senza codice, chi sblocca il telefono vede le tue spese.',\n      lockBtnLabel: s.pin ? 'Rimuovi il codice' : 'Imposta un codice di 4 cifre',\n      lockBtnColor: s.pin ? danger : 'var(--txt)',\n      togglePin: doTogglePin,\n      recKindTabs: [{ label: 'Spesa', k: 'out' }, { label: 'Entrata', k: 'in' }].map(t => ({\n        label: t.label, weight: s.recKind === t.k ? '600' : '500',\n        bg: s.recKind === t.k ? 'var(--pill)' : 'var(--soft)',\n        fg: s.recKind === t.k ? 'var(--pillfg)' : dim,\n        pick: () => this.setState({ recKind: t.k }),\n      })),\n      recVarLabel: s.recVariable ? 'Importo variabile: l\\u2019app lo chiede ogni mese' : 'Importo fisso ogni mese',\n      recVarWeight: s.recVariable ? '600' : '500',\n      recVarBg: s.recVariable ? 'var(--pill)' : 'var(--soft)',\n      recVarFg: s.recVariable ? 'var(--pillfg)' : dim,\n      toggleRecVar: () => this.setState(st => ({ recVariable: !st.recVariable, recAmount: '' })),\n      recAmountPh: s.recVariable ? 'variabile' : 'Importo',\n      recCatOptions: s.recKind === 'in' ? [{ id: '', name: 'Entrata (nessuna categoria)' }] : s.cats.filter(c => !c.archived).map(c => ({ id: c.id, name: c.name })),\n\n      buildId: '68-uniform-recurring-kindtabs',\n      hardReload: () => { location.replace(location.pathname + '?v=' + Date.now()); },\n\n      storageLine: (s.expenses.length === 1 ? '1 voce salvata' : s.expenses.length + ' voci salvate')\n        + ' su questo dispositivo. Fai un backup ogni tanto.',\n      exportCsv: () => this.exportCsv(),\n      importCsv: () => { if (this.csvRef.current) this.csvRef.current.click(); },\n      onCsvFile: e => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        const r = new FileReader();\n        r.onload = () => {\n          const n = this.parseCsv(String(r.result));\n          if (n) { this.buzz(18); this.toast(n + ' voci importate'); }\n          else this.toast('Nessuna voce riconosciuta nel file', danger);\n        };\n        r.readAsText(f);\n        e.target.value = '';\n      },\n      backup: () => {\n        this.download('spese-backup.json', JSON.stringify({\n          cats: s.cats, expenses: s.expenses, recurring: s.recurring,\n          plans: s.plans, debts: s.debts, goals: s.goals, theme: s.theme, accent: s.accent,\n          bgDark: s.bgDark, bgLight: s.bgLight, appStyle: s.appStyle,\n          userName: s.userName, nameAsked: s.nameAsked,\n          monthBudget: s.monthBudget, goalSave: s.goalSave, goalTotal: s.goalTotal,\n          budgetRuleOn: s.budgetRuleOn, budgetSplit: s.budgetSplit, budgetLabels: s.budgetLabels,\n          pin: s.pin, bioId: s.bioId,\n        }), 'application/json');\n        this.commit({ lastBackup: new Date().toISOString() });\n        this.toast('Salvalo sempre nella stessa cartella: sostituirà il precedente');\n      },\n      backupLine: (() => {\n        const d = s.lastBackup ? Math.floor((Date.now() - Date.parse(s.lastBackup)) / 864e5) : null;\n        const age = d === null ? 'Nessun backup ancora fatto'\n          : (d === 0 ? 'Ultimo backup: oggi' : 'Ultimo backup: ' + d + (d === 1 ? ' giorno fa' : ' giorni fa'));\n        return age + (s.persisted ? ' · memoria protetta dal browser' : '');\n      })(),\n      backupColor: (!s.lastBackup && s.expenses.length > 3) ? danger : 'var(--dim)',\n      restore: () => { if (this.jsonRef.current) this.jsonRef.current.click(); },\n      onJsonFile: e => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        const r = new FileReader();\n        r.onload = () => {\n          try {\n            const data = JSON.parse(String(r.result).replace(/^\\ufeff/, ''));\n            if (!data || !Array.isArray(data.expenses)) throw 0;\n            this.askConfirm('Sostituire i dati attuali?', 'Il backup che stai importando prender\\u00e0 il posto di tutte le spese, categorie e impostazioni presenti ora.', () => {\n              this.commit({\n                cats: (data.cats && data.cats.length) ? data.cats : DEFAULT_CATS,\n                expenses: data.expenses, recurring: data.recurring || [],\n                plans: data.plans || [], debts: data.debts || [], goals: data.goals || [],\n                theme: data.theme || s.theme, accent: data.accent || s.accent,\n                bgDark: data.bgDark || s.bgDark, bgLight: data.bgLight || s.bgLight, appStyle: data.appStyle || s.appStyle,\n                userName: data.userName || s.userName, nameAsked: data.nameAsked || s.nameAsked,\n                monthBudget: data.monthBudget || null, goalSave: data.goalSave || null, goalTotal: data.goalTotal || null,\n                budgetRuleOn: !!data.budgetRuleOn,\n                budgetSplit: data.budgetSplit || { need: 50, want: 30 },\n                budgetLabels: data.budgetLabels || { need: 'Necessità', want: 'Desideri', save: 'Risparmio' },\n                pin: data.pin || null, bioId: data.bioId || null,\n              });\n              this.toast('Backup ripristinato');\n            }, { danger: true, confirmLabel: 'Sostituisci' });\n          } catch (err) { this.toast('File non valido', danger); }\n        };\n        r.readAsText(f);\n        e.target.value = '';\n      },\n      wipe: () => {\n        this.askConfirm('Cancellare tutte le spese?', 'Categorie, budget e impostazioni restano. Un eventuale backup già scaricato non viene toccato.',\n          () => this.commit({ expenses: [], recurring: [], screen: 'home' }),\n          { danger: true, confirmLabel: 'Cancella tutto' });\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
